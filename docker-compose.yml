# Local Postgres only. Existing `delorey_pg` volumes are not auto-migrated;
# recreate the volume (`docker compose down -v`) or keep pointing DATABASE_URL
# at the old credentials if you still need that local data.
name: seloma
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: seloma
      POSTGRES_PASSWORD: seloma
      POSTGRES_DB: seloma
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seloma"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg:
